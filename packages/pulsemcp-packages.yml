method: searched
source: >-
  https://github.com/pulsemcp/mcp-servers (32 first-party MCP server manifests,
  each a server.json naming its npm identifier) and
  https://github.com/pulsemcp/air (the AIR framework monorepo). Every version and
  publish date below was read from the npm registry metadata endpoint
  https://registry.npmjs.org/<pkg> on 2026-08-13, not from the repo.
description: >-
  First-party PulseMCP packages published to npm. PulseMCP ships NO client SDK for
  its own PulseMCP Registry API (api.pulsemcp.com) in any language — the only
  first-party client for that API is the @pulsemcp/pulse-subregistry MCP server,
  which embeds a hand-rolled fetch client. Everything else PulseMCP publishes is
  either (a) an MCP server that wraps somebody else's product, or (b) the AIR
  (Agent Infrastructure Repository) framework. All packages are published by the
  npm accounts `tadasant` (Tadas Antanavicius) and `macoughl` (Mike Coughlin), the
  two PulseMCP founders, from repositories in the github.com/pulsemcp organization.
notes:
  - >-
    Currency signal: the four `@pulsemcp/*` productionized MCP servers and the bulk
    of the experimental servers were last published 2026-06-14; the AIR framework
    packages were all cut together at 0.13.1 on 2026-06-22. Nothing in this set has
    been republished since 2026-07-10.
  - >-
    The 28 experimental servers publish under UNSCOPED npm names
    (e.g. `gmail-workspace-mcp-server`), not under the `@pulsemcp/` scope. The scope
    is only used for the four productionized servers and the AIR packages.
  - >-
    A registry-wide npm search for `scope:pulsemcp` returns 0 objects; every entry
    below was confirmed by a direct GET against registry.npmjs.org.

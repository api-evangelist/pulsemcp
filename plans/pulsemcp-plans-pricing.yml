what_is_free:
  - >-
    The whole www.pulsemcp.com directory — MCP servers, MCP clients, use cases,
    blog, The Agentic Loop newsletter, ecosystem stats and the Discord community —
    is free to browse with no account.
  - >-
    Every first-party npm package (32 MCP servers, 11 AIR framework packages) is
    open source under MIT, except @pulsemcp/svg-tracer-mcp-server which is GPL-2.0.
    See packages/pulsemcp-packages.yml.

what_is_gated:
  - surface: PulseMCP Registry API (api.pulsemcp.com)
    gate: X-API-Key issued only by emailing hello@pulsemcp.com. No signup form.
  - surface: Premium response enrichments
    gate: >-
      remotes[].isSelfHosted, remotes[].authOptions, remotes[].tools,
      packages[].authOptions and packages[].tools are marked Premium in the API
      reference and are activated per tenant on request. Everything else in the
      response — including the popularity estimates
      (visitorsEstimateMostRecentWeek/LastFourWeeks/Total) and isOfficial — is
      available to any key holder.


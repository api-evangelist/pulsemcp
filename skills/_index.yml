tiers:
  '1': acquire — get a transcript onto disk, redacted, in OpenTranscripts form.
  '2': decompose — build the recursive Transcript Segment tree.
  '3': analyze — per-segment analyzers across prompts, Skills, MCP and outcomes, plus a cross-transcript pass.
  '4': report — one consolidated recommendation slate across the whole batch.


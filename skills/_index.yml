description: >-
  PulseMCP publishes 18 Agent Skills of its own, indexed in an AIR skills.json and
  authored as SKILL.md files. They are NOT skills for calling the PulseMCP Registry
  API — no such skill exists, and there is no OpenAPI to ground one in. They are a
  single plugin, `agent-transcript-analysis`: a four-tier pipeline that ingests
  Claude Code session transcripts, decomposes them into a segment tree, analyses
  prompting / Skills / MCP performance per segment, and synthesizes an actionable
  report. This is PulseMCP's agentic-engineering consulting practice packaged as
  artifacts.

  NOTHING HERE WAS AUTHORED BY API EVANGELIST. Every entry is the provider's own
  title, description and path, transcribed from their index.

status_caveat: >-
  The repository README states plainly: "Status: scaffold. The skills capture the
  intended flow but are not implemented yet." Recorded as published-but-scaffold —
  the artifacts exist and are real, the implementations behind them may not.


generated: '2026-08-13'
method: searched
status: published
source: >-
  https://github.com/pulsemcp/mcp-servers — 32 first-party MCP server manifests
  (server.json, MCP registry schema 2025-09-29), each read verbatim on 2026-08-13,
  cross-checked against registry.npmjs.org for published version and date.
description: >-
  PulseMCP authors and maintains 32 MCP servers — 4 "productionized" under the
  @pulsemcp/ npm scope and 28 "experimental" under unscoped npm names. EVERY ONE OF
  THEM IS A LOCAL STDIO SERVER distributed as an npm package. PulseMCP operates NO
  hosted/remote MCP endpoint of its own: there is no mcp.pulsemcp.com, and
  https://api.pulsemcp.com/mcp returns the API's JSON 404 (invalid_path). An agent
  cannot reach PulseMCP over MCP without a human first installing a package on a
  machine.

  The one server that fronts PulseMCP's OWN product is
  @pulsemcp/pulse-subregistry, an stdio wrapper over the PulseMCP Registry API at
  https://api.pulsemcp.com/v0.1. Its three tools are bound to the REST surface in
  mcp/pulsemcp-tool-crosswalk.yml. The other 31 servers wrap third-party products
  (Gmail, Slack, Vercel, 1Password, Fly.io, AWS, …) and are first-party PulseMCP
  code but not a PulseMCP API surface.

deployment:
  mode: local-stdio
  install: npx -y @pulsemcp/pulse-subregistry
  package: https://www.npmjs.com/package/@pulsemcp/pulse-subregistry
  auth: api-key
  verified: searched
  note: >-
    mode is local-stdio for all 32 servers: every server.json declares
    transport.type "stdio" with runtimeHint "npx". `install` and `package` above
    name the server that reaches PulseMCP's own data; the full roster is in
    servers[] below. auth: api-key because pulse-subregistry requires
    PULSEMCP_SUBREGISTRY_API_KEY (sent as X-API-Key) and optionally
    PULSEMCP_SUBREGISTRY_TENANT_ID (sent as X-Tenant-ID); keys are issued only by
    emailing hello@pulsemcp.com.

remote_endpoint_probes:
  - url: https://api.pulsemcp.com/mcp
    status: 404
    note: JSON invalid_path error from the API host — no MCP endpoint served.
  - url: https://mcp.pulsemcp.com
    status: null
    note: >-
      No such host is documented or advertised anywhere in PulseMCP's docs, GitHub
      org, or llms.txt; not probed as a guessed URL.

primary_server:
  name: com.pulsemcp/pulse-subregistry
  package: '@pulsemcp/pulse-subregistry'
  version: '0.0.8'
  published: '2026-06-14'
  transport: stdio
  install: npx -y @pulsemcp/pulse-subregistry
  source: https://github.com/pulsemcp/mcp-servers/tree/main/productionized/pulse-subregistry
  backing_api: https://api.pulsemcp.com/v0.1
  environment:
    - name: PULSEMCP_SUBREGISTRY_API_KEY
      required: true
      secret: true
      description: PulseMCP API key for authentication (sent as the X-API-Key header).
    - name: PULSEMCP_SUBREGISTRY_TENANT_ID
      required: false
      description: Tenant identifier for multi-tenant use (sent as the X-Tenant-ID header).
    - name: SHOW_ADMIN_TOOLS
      required: false
      default: 'false'
      description: Enable admin tools including switch_tenant_id.
  tools:
    - name: list_servers
      description: >-
        Browse MCP servers from the PulseMCP Sub-Registry. Returns a paginated list
        of active and deprecated servers with their names, descriptions, and
        metadata. Deleted servers are excluded by default. Use search to filter by
        name or description. Use cursor for pagination through large result sets.
      inputSchema_params: [limit, cursor, search, updated_since, latest_only, expand_fields]
    - name: get_server
      description: >-
        Get detailed information about a specific MCP server from the PulseMCP
        Sub-Registry. Returns the server's metadata, description, repository URL,
        and other available information for active and deprecated servers. Use
        "latest" version (default) or specify a specific version number.
      inputSchema_params: [server_name, version, expand_fields]
    - name: switch_tenant_id
      description: >-
        Switch the active tenant ID used for all subsequent API requests. This is an
        admin tool for multi-tenant scenarios. Pass an empty string to clear the
        tenant ID.
      inputSchema_params: [tenant_id]
      gated_by: SHOW_ADMIN_TOOLS=true
  tools_source: >-
    Read verbatim from the server's own source
    (productionized/pulse-subregistry/shared/src/tools/*.ts) — a live tools/list
    could not be captured because the server is stdio-only and requires an API key
    PulseMCP issues by email.

other_productionized_tools:
  - server: com.pulsemcp/pulse-fetch
    tools:
      - name: scrape
        description: >-
          Scrape webpage content using intelligent automatic strategy selection with
          built-in caching. Fetches content from any URL with flexible result
          handling options.
  - server: com.pulsemcp/image-diff
    tools:
      - name: get_diff_of_images
        description: Compare two images pixel-by-pixel and identify visual differences.
  - server: com.pulsemcp/svg-tracer
    tools:
      - name: trace_bitmap_to_svg
        description: Convert a bitmap image to SVG vector graphics using potrace tracing.


agent_access_note: >-
  Worth recording alongside the llms.txt, because the two point in opposite
  directions: https://www.pulsemcp.com/robots.txt (HTTP 200, the only path a plain
  client can read) carries `Content-Signal: search=yes,ai-train=no,use=reference`
  and an explicit `Disallow: /` for ClaudeBot, GPTBot, Google-Extended,
  Applebot-Extended, CCBot, Bytespider, Amazonbot and meta-externalagent. So
  PulseMCP publishes a file addressed to LLMs while its edge blocks the named LLM
  crawlers and 403s generic clients. Its terms of service reinforce this: it
  prohibits "any automated means, including bots, scrapers, or spiders, to access
  or collect data from the Website (besides via the provided REST API) without our
  prior written consent" — the REST API is the sanctioned machine path, and it
  requires a key issued by email.

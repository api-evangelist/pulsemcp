entries:
  - version: 0.13.1
    date: '2026-06-22'
    breaking: []
    additions: []
    highlights:
      - >-
        Fixed - a single catalog's malformed content no longer aborts the entire
        `air prepare` / `resolveArtifacts`; per-source and per-plugin failures now
        degrade to a warning and are dropped.
      - >-
        The one deliberate hard failure retained is a catalog URI whose scheme has
        no installed provider extension, raised as a new CatalogConfigError.
  - version: 0.13.0
    date: '2026-06-12'
    breaking: []
    deprecations:
      - >-
        Declaring a plugin's body inline on the `plugins.json` entry (no `path`) is
        deprecated in favour of the `.plugin/plugin.json` manifest.
    additions:
      - >-
        A plugin entry can externalize its body into a `.plugin/plugin.json`
        manifest referenced by `path`, keeping `plugins.json` a lightweight registry.
  - version: 0.12.1
    date: '2026-06-10'
    breaking: []
    highlights:
      - >-
        `@pulsemcp/air-provider-github` — catalog `git clone`/`fetch` are now
        bounded by a hard wall-clock timeout and retried with backoff.
  - version: 0.12.0
    date: '2026-06-09'
    breaking: []
    highlights:
      - >-
        Changed - root membership is now declared on artifacts via
        `default_in_roots`, inverting the previous root-side `default_*` model.
  - version: 0.11.0
    date: '2026-06-04'
    breaking: []
    highlights:
      - >-
        `@pulsemcp/air-cowork` — `air export cowork` now carries each hook's
        `HOOK.json` (and its `x-config`) into the exported plugin.

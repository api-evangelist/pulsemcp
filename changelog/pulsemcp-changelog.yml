description: >-
  PulseMCP keeps disciplined, dated, Keep-a-Changelog-formatted changelogs for its
  OPEN SOURCE — the AIR framework and every MCP server — but publishes NO changelog
  for the PulseMCP Registry API. A partner integrating against api.pulsemcp.com has
  no published record of what changed in v0.1 or when. This artifact records both
  facts.

api_changelog:
  published: false
  url: null
  scheme: path-prefix versioning only (v0.1); no dated entries
  current_version: v0.1
  runtime_introspection: >-
    GET /v0.1/version returns the API version, git commit and build timestamp — the
    only way a consumer can detect that the API changed, and it requires an API key.
  note: >-
    Because the API is v0.x, key-gated and partner-negotiated, changes are
    presumably communicated directly to partners by email rather than published.
    That is a reasonable posture for a pre-1.0 partner API and a real gap for anyone
    evaluating it from outside.

